[project]
name = "jcron"
version = "0.1.0"
description = "Reminders, repeating tasks and condition checks that LLM sessions pick up later."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Wittber" }]
keywords = ["llm", "mcp", "claude", "reminders", "scheduler", "cron"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Utilities",
]
dependencies = [
    "pyyaml>=6",
    "croniter>=2",
    "dateparser>=1.2",
    "mcp>=2.3",
]

[project.urls]
Homepage = "https://github.com/simonwittber/jcron"
Issues = "https://github.com/simonwittber/jcron/issues"

[project.scripts]
jcron = "jcron.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
